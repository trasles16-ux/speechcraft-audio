name: Release SpeechCraft Studio

# Tag-driven release: push a v* tag -> tests run, the EXE and the NSIS
# Setup.exe are built, checksummed, and attached to a GitHub Release.
# The EXE build needs the same Windows-only deps as local builds (see
# requirements.txt); the vendored tools/nsis NSIS 3.10 compiles the
# installer so CI and local builds stay byte-identical in behaviour.
#
# Replaces the v1.3.6 manual-only workflow that never built the
# Setup.exe and carried dead release-trigger code.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m pytest tests/test_pure_logic.py tests/test_feature_flags.py tests/test_feature_toggling.py tests/test_feature_manager.py tests/test_prefs.py tests/test_installer_edition_merge.py -q

      - name: Build EXE
        run: pyinstaller SpeechCraft_Studio.spec --noconfirm

      - name: Verify EXE was produced
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/SpeechCraft_Studio.exe")) { Write-Error "No EXE produced!"; exit 1 }
          $size = (Get-Item "dist/SpeechCraft_Studio.exe").Length / 1MB
          Write-Host ("EXE size: {0:N1} MB" -f $size)

      - name: Stage for NSIS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/staging | Out-Null
          Copy-Item dist/SpeechCraft_Studio.exe build/staging/
          Copy-Item installer/ReadMe.txt build/staging/ReadMe.txt

      - name: Build NSIS Setup.exe
        shell: pwsh
        run: |
          $makensis = "tools/nsis/nsis-3.10/Bin/makensis.exe"
          $version = (Select-String -Path audio_editor.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          $tag = "$env:GITHUB_REF_NAME"
          if ($tag -ne "v$version") {
            Write-Error "Tag $tag does not match audio_editor.py __version__ $version. Bump one of them."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path build/nsis-out | Out-Null
          & $makensis /DAPP_VERSION=$version /DSTAGING="$(Resolve-Path build/staging)" /DOUT_DIR="$(Resolve-Path build/nsis-out)" installer/speechcraft_setup.nsi
          if ($LASTEXITCODE -ne 0) { Write-Error "NSIS compile failed"; exit 1 }

      - name: Installer smoke test (silent install, verify, uninstall)
        shell: pwsh
        run: |
          $version = (Select-String -Path audio_editor.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          python scripts/installer_smoke.py --setup build/nsis-out/SpeechCraft_Studio_Setup.exe --version $version

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-smoke-logs
          path: build/installer-smoke/
          if-no-files-found: ignore

      - name: Checksums
        shell: pwsh
        run: |
          $files = @("dist/SpeechCraft_Studio.exe", "build/nsis-out/SpeechCraft_Studio_Setup.exe")
          foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $out = "$f.sha256"
            # Format matches `sha256sum -c`: lowercase hex, two spaces, basename, no line terminator.
            [IO.File]::WriteAllText($out, "$h  $(Split-Path $f -Leaf)")
            Write-Output "$h  $(Split-Path $f -Leaf)"
          }

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --title "SpeechCraft Studio ${TAG#v}"
          gh release upload "$TAG" \
            dist/SpeechCraft_Studio.exe dist/SpeechCraft_Studio.exe.sha256 \
            build/nsis-out/SpeechCraft_Studio_Setup.exe build/nsis-out/SpeechCraft_Studio_Setup.exe.sha256 \
            --clobber
