name: Bug Report
description: Something is not working the way it should.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      content: |
        Thanks for filing a bug. The more detail you give, the faster we can fix it.

        **Tip:** if the app is still open, **Help → Report a Bug** does most of this for you automatically.
  - type: input
    id: title
    attributes:
      label: Short title
      placeholder: "Piper TTS dialog says 'unknown' for voice list"
    validations:
      required: true
  - type: textarea
    id: what_doing
    attributes:
      label: What were you doing?
      placeholder: "I opened Speech → Piper TTS and selected the first voice."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "NVDA should announce the voice name, e.g. 'English SA (Female - Carina)'."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      placeholder: "NVDA announced just 'unknown' or 'combo box' with no name."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch SpeechCraft Studio
        2. Open the Speech menu
        3. Click Piper TTS
        4. Tab to the voice list
    validations:
      required: false
  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "3.11.9"
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 23H2"
    validations:
      required: false
  - type: dropdown
    id: screen_reader
    attributes:
      label: Screen reader (if any)
      options:
        - NVDA
        - JAWS
        - Narrator
        - VoiceOver
        - Not using a screen reader
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      placeholder: "Paste any output from speechcraft_error.log here, or attach the file."
    validations:
      required: false
